<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影子跟读训练器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        dark: '#1E293B',
                        light: '#F8FAFC',
                        success: '#10B981',
                        error: '#EF4444',
                        warning: '#F59E0B'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .subtitles-container {
                max-height: calc(100vh - 12rem);
            }
            .subtitle-item {
                @apply p-3 mb-2 rounded-lg transition-all duration-300 cursor-pointer;
            }
            .subtitle-item:hover {
                @apply bg-primary/10;
            }
            .subtitle-item.active {
                @apply bg-primary/20 border-l-4 border-primary;
            }
            .control-btn {
                @apply px-4 py-2 rounded-lg transition-colors flex items-center;
            }
            .current-subtitle-word {
                @apply cursor-pointer hover:text-primary transition-colors;
            }
            .current-subtitle-word:hover {
                @apply underline;
            }
            .correction-word {
                @apply px-1 rounded mx-0.5;
            }
            .correction-word.correct {
                @apply bg-success/20 text-success;
            }
            .correction-word.incorrect {
                @apply bg-error/20 text-error line-through;
            }
            .correction-word.missing {
                @apply bg-warning/20 text-warning;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-dark">
    <div class="container mx-auto px-4 py-6">
        <!-- 标题区域 -->
        <header class="mb-6 text-center">
            <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-primary mb-2">
                <i class="fa fa-play-circle mr-2"></i>影子跟读训练器
            </h1>
            <p class="text-gray-600">左侧导入视频，右侧导入SRT字幕，点击字幕自动定位播放，点击单词可翻译</p>
        </header>
        
        <!-- 主要内容区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 左侧视频区域 -->
            <div class="bg-white rounded-xl shadow-md p-4 flex flex-col">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <i class="fa fa-video-camera text-primary mr-2"></i>视频播放区
                </h2>
                
                <!-- 视频导入区域 -->
                <div id="video-upload" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-4 cursor-pointer hover:border-primary transition-colors">
                    <i class="fa fa-cloud-upload text-5xl text-gray-400 mb-3"></i>
                    <p class="text-gray-500">点击或拖拽视频文件到此处</p>
                    <input type="file" id="file-input" accept="video/*" class="hidden">
                </div>
                
                <!-- 视频播放器 -->
                <div id="video-container" class="hidden flex flex-col flex-grow">
                    <video id="video-player" class="w-full rounded-lg shadow-sm" controls></video>
                    
                    <!-- 字幕控制按钮 -->
                    <div class="mt-2 flex justify-end">
                        <button id="toggle-subtitle" class="control-btn bg-gray-200 text-dark hover:bg-gray-300">
                            <i class="fa fa-eye-slash mr-2"></i>隐藏字幕
                        </button>
                    </div>
                    
                    <!-- 当前字幕显示区 -->
                    <div id="current-subtitle-container" class="mt-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                        <h3 class="text-sm font-medium text-gray-500 mb-2">当前字幕：</h3>
                        <div id="current-subtitle-display" class="text-lg min-h-[40px]">
                            <!-- 当前字幕内容将在这里显示 -->
                        </div>
                    </div>
                    
                    <!-- 听写字幕区域 -->
                    <div class="mt-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                        <h3 class="text-sm font-medium text-gray-500 mb-2">听写字幕：</h3>
                        <textarea id="subtitle听写" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary" placeholder="请听写上面的字幕内容..."></textarea>
                        <div class="mt-2 flex justify-end">
                            <button id="check听写" class="control-btn bg-primary text-white hover:bg-primary/90">
                                <i class="fa fa-check mr-2"></i>检查听写
                            </button>
                        </div>
                    </div>
                    
                    <!-- 听写检查结果 -->
                    <div id="听写结果" class="mt-3 p-4 bg-gray-50 rounded-lg border border-gray-200 hidden">
                        <h3 class="text-sm font-medium text-gray-500 mb-2">
                            <i class="fa fa-check-circle text-primary mr-1"></i>检查结果：
                        </h3>
                        <div id="correction-display" class="text-gray-700"></div>
                        <div id="score-display" class="mt-2 font-medium"></div>
                    </div>
                    
                    <!-- 单词翻译结果区 -->
                    <div id="translation-result" class="mt-3 p-4 bg-gray-50 rounded-lg border border-gray-200 hidden">
                        <h3 class="text-sm font-medium text-gray-500 mb-2">
                            <i class="fa fa-language text-primary mr-1"></i>单词翻译：
                        </h3>
                        <div class="flex flex-col">
                            <p class="font-medium" id="translated-word"></p>
                            <p class="text-gray-700 mt-1" id="translation-content"></p>
                        </div>
                    </div>
                    
                    <!-- 视频控制按钮区域 -->
                    <div class="mt-4 flex flex-wrap gap-3 items-center">
                        <button id="play-pause-btn" class="control-btn bg-primary text-white hover:bg-primary/90">
                            <i class="fa fa-pause mr-2"></i>暂停
                        </button>
                        
                        <div class="flex items-center border rounded-lg overflow-hidden">
                            <button id="decrease-speed" class="control-btn bg-gray-100 hover:bg-gray-200">
                                <i class="fa fa-minus"></i>
                            </button>
                            <span id="speed-display" class="px-4 py-2 bg-white border-x">1.0x</span>
                            <button id="increase-speed" class="control-btn bg-gray-100 hover:bg-gray-200">
                                <i class="fa fa-plus"></i>
                            </button>
                        </div>
                        
                        <button id="stop-repeat" class="control-btn bg-gray-500 text-white hover:bg-gray-600 ml-auto">
                            <i class="fa fa-stop-circle mr-2"></i>停止重复
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 右侧字幕区域 -->
            <div class="bg-white rounded-xl shadow-md p-4 flex flex-col">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <i class="fa fa-closed-captioning-o text-primary mr-2"></i>字幕列表
                </h2>
                
                <!-- 字幕导入区域 -->
                <div id="subtitle-upload" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center mb-4 cursor-pointer hover:border-primary transition-colors">
                    <i class="fa fa-file-text-o text-4xl text-gray-400 mb-3"></i>
                    <p class="text-gray-500">点击或拖拽SRT字幕文件到此处</p>
                    <input type="file" id="subtitle-file-input" accept=".srt" class="hidden">
                </div>
                
                <div id="subtitle-placeholder" class="flex-grow flex flex-col items-center justify-center text-gray-400 border-2 border-dashed rounded-lg p-6">
                    <i class="fa fa-file-text-o text-5xl mb-3"></i>
                    <p>导入SRT字幕文件后显示字幕列表</p>
                    <p class="text-sm mt-2">点击字幕可跳转到对应时间点并重复播放</p>
                </div>
                
                <div id="subtitles-list" class="hidden subtitles-container overflow-y-auto">
                    <!-- 字幕项将通过JS动态添加 -->
                </div>
            </div>
        </div>
    </div>

    <script src="reload.js"></script>
</body>

</html>
